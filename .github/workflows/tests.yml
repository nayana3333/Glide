name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check ml/ backend/

  ml-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      # Only pandas/numpy/pytest are needed for dip_detector and buffer_engine -
      # kept separate from the backend job so this stays fast and reliable.
      - run: pip install pandas numpy pytest
      - run: python -m pytest ml/tests/ -v

  backend-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      # Pulls in Prophet/SHAP, so this job is slower than ml-unit-tests -
      # that's expected, not a sign something's wrong.
      - run: |
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt
      - run: python -m pytest backend/tests/ -v
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
