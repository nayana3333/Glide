# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> connect this repo. Render reads
# this file and creates the web service + database below automatically.
#
# Note: the backend installs Prophet and SHAP, which pull in a compiled
# cmdstan backend and numba/llvmlite - this is a genuinely heavy build for a
# free tier (several minutes, real memory use during the build). If the free
# tier's build fails or times out, that's why; Render's paid Starter tier
# gives more build resources.

services:
  - type: web
    name: glide-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glide-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false # set manually once the Vercel frontend URL is known

databases:
  - name: glide-db
    databaseName: glide
    plan: free
